# The UI and the API on one origin: the browser never talks to the API container (or the
# database) directly, and the session cookie stays same-origin.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Uploads: MAX_UPLOAD_MB (50) plus room for the form fields. The API enforces the real limit.
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Set, not appended: a client cannot forge the IP the login throttle counts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;  # stream uploads to the API
        proxy_read_timeout 180s;      # a local model can take a while to answer
        # The API sets its own, stricter security headers.
    }

    # Built files have content hashes in their names: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
    }

    # Client-side routes (/admin, /login) all load the same page.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
