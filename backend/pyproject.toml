[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "campusmate-backend"
version = "0.1.0"
description = "CampusMate AI backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "chromadb>=1.0",
    "fastembed>=0.5",
    "pyyaml>=6.0",
    "httpx>=0.27",  # talks to the answer-generation server (OpenAI-compatible API)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.13",  # HTTP client used by FastAPI/Starlette's TestClient
    "fpdf2>=2.7",  # builds small text PDFs in ingestion tests
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
